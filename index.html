<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon classeur numérique STI2D SIN</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .error-message { color: #ff3b93; font-size: 0.85rem; display: none; text-align: left; }
    .logo-mark { filter: drop-shadow(0 0 6px #38bdf8); flex: 0 0 auto; }
    .brand { display: flex; align-items: center; gap: 10px; }
  </style>
</head>
<body>
  <div class="modal-overlay" id="loginModal">
    <div class="login-card">
      <button class="close-modal" aria-label="Fermer" onclick="closeModal()">×</button>
      <div class="brand-title">Mon Classeur</div>
      <h2>Connexion</h2>
      <p>Identifiez-vous pour accéder au site.</p>
      <form onsubmit="checkLogin(event)">
        <div class="form-group">
          <label for="username">Identifiant</label>
          <input type="text" id="username" required placeholder="Votre identifiant">
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <div id="loginError" class="error-message">Identifiant incorrect. Veuillez réessayer.</div>
        <button type="submit" class="btn-submit">Se connecter</button>
      </form>
      <a href="#" class="guest-link" onclick="closeModal()">Continuer sans se connecter (Mode invité)</a>
    </div>
  </div>

  <section class="hero">
    <svg class="bolt" viewBox="0 0 640 260" aria-hidden="true">
      <path d="M120 0 L150 70 L110 100 L190 170 L150 200 L180 260 M150 70 L210 110 L250 150 M110 100 L70 140" fill="none" stroke="#7dd3fc" stroke-width="2"/>
    </svg>
    <div class="orb" aria-hidden="true"></div>
    <h1>Bienvenue</h1>
    <p class="hero-sub">Systèmes d'information et numérique</p>
  </section>

  <header class="topbar">
