
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Éco-Nettoyeur</title>

  <style>
    body {
      margin: 0;
      background: #0a1a2a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    canvas {
      max-width: 100%;
      max-height: 100vh;
      height: auto;
      display: block;
    }
  </style>
</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js"></script>

<script>
const LARGEUR = 1920;
const HAUTEUR = 1080;

// --------------------------------------------------
// CONFIGURATION PHASER
// --------------------------------------------------

const config = {
    type: Phaser.AUTO,
    width: LARGEUR,
    height: HAUTEUR,
    backgroundColor: "#102333",

    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
    },

    scene: {
        create: create,
        update: update
    }
};

const game = new Phaser.Game(config);

// --------------------------------------------------
// VARIABLES DU JEU
// --------------------------------------------------

let player;
let cursors;
let objets = [];

let score = 0;
let vies = 3;
let temps = 0;

let delaiApparition = 750;
let vitesse = 220;

let scoreTexte;
let viesTexte;
let message;
let bouton;

let termine = false;

let arbres = [];
let arbresAffiches = [];

// --------------------------------------------------
// CREATION DU ROBOT NETTOYEUR
// --------------------------------------------------

function creerRobot(scene, x, y) {
    const robot = scene.add.container(x, y);

    // Antenne
    robot.add(
        scene.add.line(
            0, -24, 0, 0, 0, -8, 0x123a5a
        ).setLineWidth(3)
    );

    robot.add(
        scene.add.circle(0, -24, 5, 0xf97316)
            .setStrokeStyle(2, 0x123a5a)
    );

    // Tête
    robot.add(
        scene.add.rectangle(
            0, -8, 34, 27, 0x1687c9
        ).setStrokeStyle(3, 0x123a5a)
    );

    // Écran et yeux
    robot.add(
        scene.add.rectangle(0, -9, 25, 14, 0x102333)
    );

    robot.add([
        scene.add.circle(-7, -9, 3, 0x60e7ff),
        scene.add.circle(7, -9, 3, 0x60e7ff)
    ]);

    // Corps
    robot.add(
        scene.add.rectangle(
            0, 18, 42, 28, 0x268cc7
        ).setStrokeStyle(3, 0x123a5a)
    );

    // Panneau d'énergie
    robot.add(
        scene.add.rectangle(
            0, 18, 18, 13, 0xfbbf24
        ).setStrokeStyle(2, 0x854d0e)
    );

    // Bras et mains
    robot.add([
        scene.add.rectangle(
            -26, 16, 9, 24, 0x1687c9
        ).setStrokeStyle(2, 0x123a5a),

        scene.add.rectangle(
            26, 16, 9, 24, 0x1687c9
        ).setStrokeStyle(2, 0x123a5a),

        scene.add.circle(-26, 29, 5, 0x94a3b8)
            .setStrokeStyle(2, 0x123a5a),

        scene.add.circle(26, 29, 5, 0x94a3b8)
            .setStrokeStyle(2, 0x123a5a)
    ]);

    // Jambes et pieds
    robot.add([
        scene.add.rectangle(
            -11, 39, 9, 17, 0x1687c9
        ).setStrokeStyle(2, 0x123a5a),

        scene.add.rectangle(
            11, 39, 9, 17, 0x1687c9
        ).setStrokeStyle(2, 0x123a5a),

        scene.add.rectangle(
            -12, 48, 16, 6, 0x94a3b8
        ).setStrokeStyle(2, 0x123a5a),

        scene.add.rectangle(
            12, 48, 16, 6, 0x94a3b8
        ).setStrokeStyle(2, 0x123a5a)
    ]);

    robot.setScale(1.35);

    return robot;
}

// --------------------------------------------------
// POUBELLE RECYCLABLE
// La toucher fait perdre une vie
// --------------------------------------------------

function creerPoubelle(scene, x, y) {
    const poubelle = scene.add.container(x, y);

    poubelle.add([
        scene.add.rectangle(
            0, 3, 32, 39, 0x159e8a
        ).setStrokeStyle(2, 0x075e55),

        scene.add.rectangle(
            0, -19, 38, 7, 0x38bda8
        ).setStrokeStyle(2, 0x075e55),

        scene.add.rectangle(-10, 3, 3, 28, 0x8be1d3),
        scene.add.rectangle(10, 3, 3, 28, 0x8be1d3)
    ]);

    poubelle.add(
        scene.add.text(0, 2, "♻", {
            fontSize: "25px",
            color: "#ffffff",
            fontStyle: "bold"
        }).setOrigin(0.5)
    );

    poubelle.add([
        scene.add.circle(-10, 25, 4, 0x64748b),
        scene.add.circle(10, 25, 4, 0x64748b)
    ]);

    poubelle.setScale(1.35);

    return poubelle;
}

// --------------------------------------------------
// BARIL TOXIQUE
// Le toucher rapporte 10 points
// --------------------------------------------------

function creerBarilToxique(scene, x, y) {
    const baril = scene.add.container(x, y);

    baril.add(
        scene.add.rectangle(
            0, 1, 36, 39, 0xf59e0b
        ).setStrokeStyle(2, 0x854d0e)
    );

    baril.add([
        scene.add.ellipse(
            0, -19, 40, 12, 0xfbbf24
        ).setStrokeStyle(2, 0x854d0e),

        scene.add.ellipse(
            0, 20, 34, 9, 0xd97706
        ).setStrokeStyle(2, 0x854d0e)
    ]);

    baril.add([
        scene.add.rectangle(0, -7, 34, 3, 0x854d0e),
        scene.add.rectangle(0, 10, 34, 3, 0x854d0e)
    ]);

    baril.add(
        scene.add.circle(
            0, 1, 12, 0x1f2937
        ).setStrokeStyle(1, 0x854d0e)
    );

    baril.add(
        scene.add.text(0, 1, "☢", {
            fontSize: "25px",
            color: "#fbbf24"
        }).setOrigin(0.5)
    );

    baril.setScale(1.35);

    return baril;
}

// --------------------------------------------------
// CREATION DES ARBRES
// --------------------------------------------------

function creerArbre(scene, x, y, taille = 1) {
    const arbre = scene.add.container(x, y);

    arbre.add(
        scene.add.rectangle(
            0, 0, 18, 65, 0x8b5a2b
        )
    );

    arbre.add([
        scene.add.circle(-15, -35, 25, 0x16a34a),
        scene.add.circle(15, -35, 25, 0x22c55e),
        scene.add.circle(0, -58, 28, 0x15803d),
        scene.add.circle(0, -35, 18, 0x4ade80)
    ]);

    arbre.setScale(taille);

    return arbre;
}

// --------------------------------------------------
// LA NATURE REVIENT SELON LE SCORE
// --------------------------------------------------

function actualiserNature(scene) {
    const paliers = [
        { score: 20, x: 120, y: 820, taille: 1.2 },
        { score: 40, x: 260, y: 825, taille: 1.5 },
        { score: 60, x: 1660, y: 820, taille: 1.3 },
        { score: 80, x: 1800, y: 825, taille: 1.6 }
    ];

    for (const info of paliers) {
        if (
            score >= info.score &&
            !arbresAffiches.includes(info.score)
        ) {
            const arbre = creerArbre(
                scene,
                info.x,
                info.y,
                info.taille
            );

            arbre.setDepth(1);

            arbres.push(arbre);
            arbresAffiches.push(info.score);
        }
    }
}

// --------------------------------------------------
// ÉCRAN DE VICTOIRE : LA NATURE EST SAUVÉE
// --------------------------------------------------

function afficherForetVictoire(scene) {
    // Voile sombre
    scene.add.rectangle(
        LARGEUR / 2,
        HAUTEUR / 2,
        LARGEUR,
        HAUTEUR,
        0x071f18,
        0.96
    ).setDepth(20);

    // Forêt complète
    for (let i = 0; i < 22; i++) {
        const x = 30 + i * 88;
        const y = Phaser.Math.Between(760, 850);
        const taille = Phaser.Math.FloatBetween(1.2, 2.1);

        const arbre = creerArbre(
            scene,
            x,
            y,
            taille
        );

        arbre.setDepth(21);
    }

    // Herbe au premier plan
    scene.add.rectangle(
        LARGEUR / 2,
        1000,
        LARGEUR,
        160,
        0x166534
    ).setDepth(22);

    scene.add.text(
        LARGEUR / 2,
        680,
        "Moins de pollution, plus de vie !",
        {
            fontSize: "30px",
            color: "#bbf7d0",
            fontStyle: "bold"
        }
    ).setOrigin(0.5).setDepth(30);

    message.setText(
        "VICTOIRE !\nLA NATURE EST SAUVÉE !"
    );

    message.setColor("#86efac");
    message.setFontSize(58);
    message.setDepth(30);
    message.setY(400);

    bouton.setDepth(31);
    bouton.setY(570);
    bouton.setVisible(true);
}

// --------------------------------------------------
// CRÉATION DU JEU
// --------------------------------------------------

function create() {
    const scene = this;

    objets = [];
    arbres = [];
    arbresAffiches = [];

    score = 0;
    vies = 3;
    temps = 0;
    delaiApparition = 750;
    vitesse = 220;
    termine = false;

    // Fond
    scene.add.rectangle(
        LARGEUR / 2,
        HAUTEUR / 2,
        LARGEUR,
        HAUTEUR,
        0x102333
    );

    // Sol
    scene.add.rectangle(
        LARGEUR / 2,
        900,
        LARGEUR,
        50,
        0x245447
    );

    scene.add.rectangle(
        LARGEUR / 2,
        875,
        LARGEUR,
        3,
        0x34d399
    ).setAlpha(0.45);

    // Robot nettoyeur
    player = creerRobot(
        scene,
        LARGEUR / 2,
        820
    );

    // Clavier
    cursors = scene.input.keyboard.createCursorKeys();

    // Score
    scoreTexte = scene.add.text(
        20, 15, "Score : 0",
        {
            fontSize: "28px",
            color: "#ffffff",
            fontStyle: "bold"
        }
    );

    // Vies
    viesTexte = scene.add.text(
        20, 55, "Vies : 3",
        {
            fontSize: "28px",
            color: "#ffffff",
            fontStyle: "bold"
        }
    );

    // Titre
    scene.add.text(
        LARGEUR / 2,
        15,
        "ECO-NETTOYEUR",
        {
            fontSize: "30px",
            color: "#34d399",
            fontStyle: "bold"
        }
    ).setOrigin(0.5, 0);

    // Règles
    scene.add.text(
        LARGEUR / 2,
        60,
        "Flèches : se déplacer | ☢ Toxique nettoyé : +10 points | ♻ Poubelle : -1 vie",
        {
            fontSize: "20px",
            color: "#cbd5e1"
        }
    ).setOrigin(0.5, 0);

    scene.add.text(
        LARGEUR - 20,
        15,
        "☢ NETTOYER    ♻ ÉVITER",
        {
            fontSize: "19px",
            color: "#34d399"
        }
    ).setOrigin(1, 0);

    // Message de fin
    message = scene.add.text(
        LARGEUR / 2,
        450,
        "",
        {
            fontSize: "52px",
            color: "#34d399",
            align: "center",
            fontStyle: "bold"
        }
    ).setOrigin(0.5).setDepth(10);

    // Bouton recommencer
    bouton = scene.add.text(
        LARGEUR / 2,
        570,
        "RECOMMENCER",
        {
            fontSize: "30px",
            color: "#ffffff",
            backgroundColor: "#167d60",
            padding: {
                x: 25,
                y: 15
            }
        }
    ).setOrigin(0.5).setDepth(10);

    bouton.setInteractive({
        useHandCursor: true
    });

    bouton.setVisible(false);

    bouton.on("pointerdown", () => {
        scene.scene.restart();
    });
}

// --------------------------------------------------
// BOUCLE PRINCIPALE
// --------------------------------------------------

function update(time, delta) {
    if (termine) {
        return;
    }

    // Déplacement rapide du robot
    const deplacement = 520 * delta / 1000;

    if (cursors.left.isDown) {
        player.x -= deplacement;
    }

    if (cursors.right.isDown) {
        player.x += deplacement;
    }

    if (cursors.up.isDown) {
        player.y -= deplacement;
    }

    if (cursors.down.isDown) {
        player.y += deplacement;
    }

    // Limites du robot
    player.x = Phaser.Math.Clamp(
        player.x,
        45,
        LARGEUR - 45
    );

    player.y = Phaser.Math.Clamp(
        player.y,
        160,
        810
    );

    // Apparition des objets
    temps += delta;

    if (temps >= delaiApparition) {
        temps = 0;
        creerObjet(this);
    }

    // Difficulté progressive
    delaiApparition = Math.max(
        250,
        750 - score * 5
    );

    vitesse = Math.min(
        560,
        220 + score * 3
    );

    // Déplacement et collisions
    for (let i = objets.length - 1; i >= 0; i--) {
        const objet = objets[i];

        objet.forme.y += objet.vitesse * delta / 1000;

        const collision =
            Phaser.Geom.Intersects.RectangleToRectangle(
                player.getBounds(),
                objet.forme.getBounds()
            );

        if (collision) {
            if (objet.danger) {
                // Ramasser un baril toxique
                score += 10;

                scoreTexte.setText(
                    "Score : " + score
                );

                actualiserNature(this);

            } else {
                // Toucher une poubelle recyclable
                vies--;

                viesTexte.setText(
                    "Vies : " + vies
                );
            }

            objet.forme.destroy();
            objets.splice(i, 1);

            // Défaite
            if (vies <= 0) {
                finPartie(
                    "GAME OVER",
                    "Plus de vies !"
                );

                return;
            }

            // Victoire à 100 points
            if (score >= 100) {
                termine = true;
                afficherForetVictoire(this);
                return;
            }

        } else if (objet.forme.y > HAUTEUR + 100) {
            objet.forme.destroy();
            objets.splice(i, 1);
        }
    }
}

// --------------------------------------------------
// CRÉATION DES OBJETS
// --------------------------------------------------

function creerObjet(scene) {
    const x = Phaser.Math.Between(
        50,
        LARGEUR - 50
    );

    // 70 % de barils toxiques et 30 % de poubelles
    const danger = Math.random() < 0.70;

    const forme = danger
        ? creerBarilToxique(scene, x, -50)
        : creerPoubelle(scene, x, -50);

    // Chaque objet conserve sa vitesse au moment
    // de son apparition.
    objets.push({
        forme: forme,
        danger: danger,
        vitesse: vitesse
    });
}

// --------------------------------------------------
// FIN DE PARTIE
// --------------------------------------------------

function finPartie(titre, sousTitre) {
    termine = true;

    message.setText(
        titre + "\n" + sousTitre
    );

    message.setColor(
        titre === "VICTOIRE !"
            ? "#34d399"
            : "#ef4444"
    );

    message.setFontSize(52);

    bouton.setText("RECOMMENCER");
    bouton.setVisible(true);
}
</script>

</body>
</html>
